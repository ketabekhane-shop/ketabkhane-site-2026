<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>کتاب‌خانه | بازار کتاب</title>
<style>
:root{--ink:#243044;--muted:#687386;--paper:#f6f4ef;--brand:#315c50;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.8}
header{background:var(--brand);color:white;padding:22px 16px}header>div,main{max-width:1050px;margin:auto}h1{margin:0;font-size:1.7rem}header p{margin:4px 0;color:#e7efeb}
main{padding:22px 16px}.toolbar,.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:white}
textarea{min-height:90px}.search{flex:1;min-width:200px}.filter{width:auto;min-width:145px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.book,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 3px 12px #1720330a}
.book img{width:100%;height:190px;object-fit:cover;border-radius:10px}.book h3{margin:8px 0 2px}
.muted{color:var(--muted);font-size:.9rem}.price{font-weight:bold;color:var(--brand);margin:6px 0}
.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--brand);color:white;cursor:pointer}.alt{background:#e9efec;color:var(--brand)}.danger{background:#a33b3b}
.panel{margin:20px 0}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.wide{grid-column:1/-1}
[hidden]{display:none!important}.notice{padding:10px 12px;border-radius:9px;background:#edf3ef;margin:10px 0}.error{background:#faeeee;color:#8a2929}
.empty{text-align:center;padding:35px;color:var(--muted)}footer{text-align:center;padding:24px;color:var(--muted)}
@media(max-width:600px){.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header><div><h1>کتاب‌خانه</h1><p>بازار ساده و دوستانهٔ کتاب</p><div class="actions"><button class="btn alt" id="adminOpen" type="button">ورود مدیر</button></div></div></header>
<main>
<section class="toolbar"><input id="search" class="search" type="search" placeholder="جست‌وجو در عنوان و توضیحات…"><select id="categoryFilter" class="filter"><option value="همه">همهٔ دسته‌ها</option></select></section>
<section id="books" class="grid" aria-live="polite"><div class="empty">در حال دریافت کتاب‌ها…</div></section>
<section id="adminPanel" class="panel" hidden>
<h2>پنل مدیریت</h2>
<div id="login"><p class="muted">برای مدیریت آگهی‌ها وارد شو.</p><div class="formgrid">
<label class="field"><span>ایمیل مدیر</span><input id="email" type="email" autocomplete="username"></label>
<label class="field"><span>رمز عبور</span><input id="pass" type="password" autocomplete="current-password"></label></div>
<div class="actions"><button class="btn" id="loginBtn" type="button">ورود</button><button class="btn alt" id="forgotBtn" type="button">فراموشی رمز عبور</button></div></div>
<div id="recovery" hidden><h3>تعیین رمز جدید</h3><label class="field"><span>رمز جدید (حداقل ۸ نویسه)</span><input id="newPass" type="password" autocomplete="new-password"></label><div class="actions"><button class="btn" id="savePassBtn" type="button">ذخیرهٔ رمز جدید</button></div></div>
<div id="dashboard" hidden><div class="notice">وارد پنل مدیریت شده‌ای.</div><h3>افزودن کتاب</h3>
<form id="bookForm" class="formgrid">
<label class="field"><span>عنوان کتاب *</span><input name="title" required maxlength="150"></label>
<label class="field"><span>قیمت (تومان) *</span><input name="price" type="number" min="0" required></label>
<label class="field"><span>دسته‌بندی</span><input name="category" maxlength="80"></label>
<label class="field"><span>وضعیت</span><select name="condition"><option>نو</option><option>در حد نو</option><option>کارکرده</option></select></label>
<label class="field"><span>شماره تماس (اختیاری)</span><input name="phone" type="tel"></label>
<label class="field"><span>تصویر (اختیاری)</span><input name="image" type="file" accept="image/*"></label>
<label class="field wide"><span>توضیحات</span><textarea name="description" maxlength="2000"></textarea></label>
<div class="wide actions"><button class="btn" id="addBtn" type="submit">ثبت آگهی</button><button class="btn alt" id="logoutBtn" type="button">خروج</button></div></form>
<h3>مدیریت آگهی‌ها</h3><div id="adminBooks"></div></div><div id="message" class="notice" hidden role="status"></div>
</section></main><footer>کتاب‌خانه — خرید و فروش کتاب</footer>
<script>
(()=>{
'use strict';
const URL='https://setnxaucootvqdvcvywc.supabase.co';
const KEY='sb_publishable_S2l1IXcMYN33aMvGj7upNg_JeHkV3pV';
const ADMIN='admin.ketabkhane@gmail.com',BUCKET='book-images';
const db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);
let books=[],isAdmin=false;
function msg(t,err=false){$('message').textContent=t;$('message').classList.toggle('error',err);$('message').hidden=false}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){let n=Number(v);return Number.isFinite(n)?n.toLocaleString('fa-IR')+' تومان':'قیمت توافقی'}
async function load(){
$('books').innerHTML='<div class="empty">در حال دریافت کتاب‌ها…</div>';
const {data,error}=await db.from('books').select('*').order('created_at',{ascending:false});
if(error){console.error(error);$('books').innerHTML='<div class="empty">دریافت کتاب‌ها انجام نشد؛ دسترسی SELECT جدول را بررسی کن.</div>';return}
books=data||[];let cats=[...new Set(books.map(b=>b.category).filter(Boolean))];
$('categoryFilter').innerHTML='<option value="همه">همهٔ دسته‌ها</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
render();if(isAdmin)adminList();
}
function render(){
let term=$('search').value.trim().toLowerCase(),cat=$('categoryFilter').value;
let rows=books.filter(b=>`${b.title||''} ${b.description||''} ${b.category||''}`.toLowerCase().includes(term)&&(cat==='همه'||b.category===cat));
$('books').innerHTML=rows.length?rows.map(b=>`<article class="book">${b.image_url&&/^https?:\/\//i.test(b.image_url)?`<img src="${esc(b.image_url)}" alt="${esc(b.title)}" loading="lazy">`:''}<h3>${esc(b.title||'بدون عنوان')}</h3><div class="muted">${esc(b.category||'بدون دسته‌بندی')} · ${esc(b.condition||'نامشخص')}</div><div class="price">${money(b.price)}</div><p>${esc(b.description||'')}</p>${b.phone?`<div class="muted">تماس: ${esc(b.phone)}</div>`:''}</article>`).join(''):'<div class="empty">هنوز کتابی برای نمایش وجود ندارد.</div>';
}
function adminList(){$('adminBooks').innerHTML=books.length?books.map(b=>`<div class="notice" style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><span>${esc(b.title)} — ${money(b.price)}</span><button class="btn danger" type="button" data-del="${esc(b.id)}">حذف</button></div>`).join(''):'<p class="muted">آگهی‌ای ثبت نشده است.</p>'}
async function login(){
let email=$('email').value.trim(),password=$('pass').value;
if(!email||!password){msg('ایمیل و رمز عبور را وارد کن.',true);return}
$('loginBtn').disabled=true;let {data,error}=await db.auth.signInWithPassword({email,password});$('loginBtn').disabled=false;
if(error){console.error(error);msg('ورود ناموفق بود؛ ایمیل و رمز عبور را بررسی کن.',true);return}
if((data.user?.email||'').toLowerCase()!==ADMIN){await db.auth.signOut();msg('این حساب اجازهٔ ورود به پنل مدیریت را ندارد.',true);return}
isAdmin=true;$('login').hidden=true;$('dashboard').hidden=false;$('pass').value='';msg('با موفقیت وارد شدی.');await load();
}
async function reset(){
let email=$('email').value.trim();if(!email){msg('ابتدا ایمیل مدیر را وارد کن.',true);return}
let {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
if(error){console.error(error);msg('ارسال لینک بازیابی انجام نشد؛ URL مجاز و تنظیمات ایمیل Supabase را بررسی کن.',true);return}
msg('اگر ایمیل ثبت شده باشد، لینک بازیابی ارسال می‌شود. پوشهٔ هرزنامه را هم بررسی کن.');
}
async function savePassword(){
let password=$('newPass').value;if(password.length<8){msg('رمز جدید باید حداقل ۸ نویسه داشته باشد.',true);return}
let {error}=await db.auth.updateUser({password});if(error){console.error(error);msg('ذخیرهٔ رمز انجام نشد؛ لینک بازیابی را دوباره باز کن.',true);return}
$('recovery').hidden=true;$('login').hidden=false;$('newPass').value='';await db.auth.signOut();msg('رمز جدید ذخیره شد؛ اکنون وارد شو.');
}
async function addBook(e){
e.preventDefault();let f=e.currentTarget,d=new FormData(f),title=String(d.get('title')||'').trim(),price=Number(d.get('price'));
if(!title||!Number.isFinite(price)||price<0){msg('عنوان و قیمت معتبر وارد کن.',true);return}
$('addBtn').disabled=true;let image_url=null,image_path=null,file=d.get('image');
if(file&&file.size){
if(!file.type.startsWith('image/')||file.size>5*1024*1024){msg('فقط تصویر با حجم حداکثر ۵ مگابایت انتخاب کن.',true);$('addBtn').disabled=false;return}
let ext=(file.name.split('.').pop()||'jpg').replace(/[^a-zA-Z0-9]/g,'')||'jpg';image_path=Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;
let up=await db.storage.from(BUCKET).upload(image_path,file,{contentType:file.type});
if(up.error){console.error(up.error);msg('بارگذاری تصویر انجام نشد؛ دسترسی Storage را بررسی کن.',true);$('addBtn').disabled=false;return}
image_url=db.storage.from(BUCKET).getPublicUrl(image_path).data.publicUrl;
}
let row={title,price,category:String(d.get('category')||'').trim(),condition:String(d.get('condition')||'کارکرده'),description:String(d.get('description')||'').trim(),phone:String(d.get('phone')||'').trim(),image_url,image_path};
let {error}=await db.from('books').insert(row);$('addBtn').disabled=false;
if(error){console.error(error);msg('ثبت آگهی انجام نشد؛ سیاست INSERT جدول را بررسی کن.',true);return}
f.reset();msg('آگهی ثبت شد.');await load();
}
async function del(id){
if(!confirm('این آگهی حذف شود؟'))return;let b=books.find(x=>String(x.id)===String(id));
let {error}=await db.from('books').delete().eq('id',id);if(error){console.error(error);msg('حذف انجام نشد؛ دسترسی DELETE را بررسی کن.',true);return}
if(b?.image_path){let r=await db.storage.from(BUCKET).remove([b.image_path]);if(r.error)console.warn(r.error)}
msg('آگهی حذف شد.');await load();
}
$('search').addEventListener('input',render);$('categoryFilter').addEventListener('change',render);
$('adminOpen').addEventListener('click',()=>$('adminPanel').hidden=!$('adminPanel').hidden);
$('loginBtn').addEventListener('click',login);$('forgotBtn').addEventListener('click',reset);$('savePassBtn').addEventListener('click',savePassword);
$('bookForm').addEventListener('submit',addBook);$('adminBooks').addEventListener('click',e=>{let b=e.target.closest('[data-del]');if(b)del(b.dataset.del)});
$('logoutBtn').addEventListener('click',async()=>{await db.auth.signOut();isAdmin=false;$('dashboard').hidden=true;$('login').hidden=false;msg('از پنل خارج شدی.')});
db.auth.onAuthStateChange(event=>{if(event==='PASSWORD_RECOVERY'){$('adminPanel').hidden=false;$('login').hidden=true;$('dashboard').hidden=true;$('recovery').hidden=false;msg('رمز جدیدت را وارد کن.')}});
load();
})();
</script></body></html>
